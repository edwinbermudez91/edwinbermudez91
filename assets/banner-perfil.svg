    <line x1="-48" y1="-28" x2="48" y2="28" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="48" y1="-28" x2="-48" y2="28" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
  </g>

